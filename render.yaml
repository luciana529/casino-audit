services:
  # Servidor API con FastAPI
  - type: web
    name: casino-audit-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casino-db
          property: connectionString

# Base de datos PostgreSQL Gratuita
databases:
  - name: casino-db
    plan: free