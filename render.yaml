services:
  # Servidor API con FastAPI
  - type: web
    name: casino-audit-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casino-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true

  # Interfaz Streamlit
  - type: web
    name: casino-audit-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_URL
        value: https://casino-audit-production.up.railway.app/api/v1

# Base de datos PostgreSQL Gratuita
databases:
  - name: casino-db
    plan: free